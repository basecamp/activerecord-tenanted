name: Regenerate appraisal gemfiles

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: true

on:
  push:
    branches:
      - "dependabot/bundler/**"
    paths:
      - Gemfile
      - Gemfile.lock

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout the dependabot branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Regenerate gemfiles from Appraisals
        run: bundle exec appraisal generate

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gemfiles
          path: gemfiles/
          retention-days: 1

  commit:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write # push regenerated gemfiles to the dependabot branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gemfiles
          path: gemfiles/

      - name: Commit regenerated gemfiles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add gemfiles/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate appraisal gemfiles"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          fi
